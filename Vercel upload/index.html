<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remote Opus Client Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Client view of each team member's update history (from Yessid's Loom "Client Backlog Updates for Ikra").
   Timeline layout follows the ChannelDock changelog shown in that video; look and feel follow remote-opus.com. */
:root{
  --bg:#f6fbf8; --surface:#ffffff; --surface-2:#f1f8f4; --fg:#0f2318; --muted:#56685d; --line:#e1ece5; --line-2:#c8e0d4;
  --brand:#2f7e51; --brand-dark:#1a4731; --tint:#e3ede7; --on-brand:#ffffff;
  --hero-a:#eaf5ef; --hero-b:#f6fbf8; --nav:#ffffff;
  --good:#2f7e51; --good-bg:#dff3e7; --bad:#c93b3a; --bad-bg:#fde8e7; --orange:#b45f00; --orange-bg:#ffefdc;
  --grey:#56685d; --grey-bg:#eef2ef; --start:#1a4731; --start-bg:#e3ede7; --mark:#cdeedb;
  --shadow:0 10px 30px rgba(15,35,24,.08); --shadow-sm:0 3px 12px rgba(15,35,24,.05);
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1712; --surface:#13201a; --surface-2:#182a21; --fg:#e7f1eb; --muted:#9db3a6; --line:#24372d; --line-2:#2c4537;
  --brand:#3fa36b; --brand-dark:#7ed9a4; --tint:#1a3326; --on-brand:#06120c;
  --hero-a:#10241a; --hero-b:#0c1712; --nav:#0f1c15;
  --good:#5cc28a; --good-bg:#143524; --bad:#ff8584; --bad-bg:#3d1615; --orange:#ffad4d; --orange-bg:#3a2408;
  --grey:#b3c4ba; --grey-bg:#1f2d26; --start:#a9dcbf; --start-bg:#1a3326; --mark:#285c40;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 3px 12px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1712; --surface:#13201a; --surface-2:#182a21; --fg:#e7f1eb; --muted:#9db3a6; --line:#24372d; --line-2:#2c4537;
  --brand:#3fa36b; --brand-dark:#7ed9a4; --tint:#1a3326; --on-brand:#06120c;
  --hero-a:#10241a; --hero-b:#0c1712; --nav:#0f1c15;
  --good:#5cc28a; --good-bg:#143524; --bad:#ff8584; --bad-bg:#3d1615; --orange:#ffad4d; --orange-bg:#3a2408;
  --grey:#b3c4ba; --grey-bg:#1f2d26; --start:#a9dcbf; --start-bg:#1a3326; --mark:#285c40;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 3px 12px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line-2);border-radius:999px;padding:10px 14px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.in{max-width:1160px;margin:0 auto;padding:0 20px}
.g{color:var(--brand)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}

/* Top bar, like remote-opus.com */
.nav{background:var(--nav);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.nav .in{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:66px;flex-wrap:wrap}
.wordmark{font-weight:800;font-size:22px;letter-spacing:-.3px;color:var(--brand-dark);text-decoration:none}
.nav-right{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-weight:600}
.client-chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line-2);border-radius:999px;padding:5px 14px 5px 5px;color:var(--fg);font-weight:700;background:var(--surface)}
.client-chip i{width:28px;height:28px;border-radius:50%;background:var(--brand-dark);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}

/* Management activity bar: read-only view of what Remote Opus management did with the team */
.mbar{background:#1a4731;color:#fff;position:relative;z-index:25}
.mbar .in{display:flex;align-items:center;gap:14px;min-height:46px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:#bfe8cf}
.pulse{position:relative;width:8px;height:8px;border-radius:50%;background:#7ed9a4;flex:none}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #7ed9a4;opacity:0;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.mitems{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden;list-style:none;margin:0;padding:0}
.mitems li{min-width:0;display:flex}
.mitem .mt{overflow:hidden;text-overflow:ellipsis}
.mitem{min-width:0;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:0;border-radius:999px;padding:5px 12px 5px 6px;color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.mitem:hover{background:rgba(255,255,255,.16)}
.mitem small{color:rgba(255,255,255,.7);font-weight:600}
.mic{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mic svg{width:13px;height:13px}
.mitem .mic{background:rgba(255,255,255,.14);color:#bfe8cf}
.mall{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1a4731;border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;white-space:nowrap}
.mall .chev{width:14px;height:14px;transition:transform .2s}
.mall[aria-expanded="true"] .chev{transform:rotate(180deg)}
.mpanel{position:absolute;right:max(20px,calc((100% - 1160px)/2 + 20px));top:calc(100% + 8px);width:min(420px,calc(100% - 40px));max-height:min(70vh,560px);overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px}
.mpanel h4{margin:10px 10px 4px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px}
.mrow:hover,.mrow:focus-visible{background:var(--surface-2)}
.mrow b{display:block;font-size:14px}
.mrow span.t{display:block;font-size:13px;color:var(--muted)}
.mrow small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.mrow .mic{width:32px;height:32px;margin-top:1px}
.mrow .mic svg{width:16px;height:16px}
.k-appreciate{background:var(--good-bg);color:var(--good)} .k-check{background:var(--tint);color:var(--brand-dark)} .k-talk{background:var(--grey-bg);color:var(--grey)}
.mline{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--muted)}
.mline .pulse{background:var(--brand)}
.mline .pulse::after{border-color:var(--brand)}
.mline b{color:var(--fg)}
.mline .sep{opacity:.5}

/* Hero */
.hero{background:linear-gradient(180deg,var(--hero-a),var(--hero-b));padding:44px 0 34px}
.hero .in{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--brand-dark)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:48px;letter-spacing:-.5px;margin-top:16px}
.hero p{margin:12px 0 0;color:var(--muted);font-size:16.5px;max-width:54ch}
.summary{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px}
.summary-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.summary-head b{font-size:15px}
.summary-head span{font-size:12px;font-weight:700;color:var(--brand-dark);background:var(--tint);border-radius:999px;padding:3px 10px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.srow .ic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex:none}
.ic.good{background:var(--good-bg);color:var(--good)} .ic.bad{background:var(--bad-bg);color:var(--bad)} .ic.grey{background:var(--grey-bg);color:var(--grey)} .ic.mg{background:var(--tint);color:var(--brand-dark)}
.srow span{flex:1;color:var(--muted);font-weight:600}
.srow .ic svg{width:17px;height:17px}
.srow b{font-size:20px;font-weight:800}

/* Team switcher: one card per person, one open at a time */
.main{padding:30px 0 56px}
.main .in{display:flex;flex-direction:column;gap:22px}
.sec-head{display:flex;align-items:baseline;gap:10px}
.sec-head .count{font-size:12px;font-weight:700;color:var(--muted)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:-8px}
.tab{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,border-color .15s}
.tab:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.tab-top{display:flex;align-items:center;gap:12px;min-width:0}
.tab-top div{min-width:0}
.tab b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab small{display:block;font-size:13px;color:var(--muted)}
.av{width:44px;height:44px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--brand-dark);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.tab-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.tally{display:flex;gap:10px}
.tally span{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.green{background:var(--good)} .dot.red{background:var(--bad)} .dot.orange{background:var(--orange)} .dot.grey{background:var(--grey)} .dot.forest{background:var(--start)}
.tab[aria-selected="true"]{background:linear-gradient(135deg,#2f7e51,#1a4732);border-color:transparent;color:#fff;box-shadow:0 14px 30px rgba(26,71,49,.28);transform:none}
.tab[aria-selected="true"] small,.tab[aria-selected="true"] .tab-foot{color:rgba(255,255,255,.82)}
.tab[aria-selected="true"] .tab-foot{border-top-color:rgba(255,255,255,.18)}
.tab[aria-selected="true"] .av{background:#fff;border-color:#fff;color:#1a4731}
.tab[aria-selected="true"] .dot.green{background:#7ed9a4} .tab[aria-selected="true"] .dot.red{background:#ff9b9b}

/* Selected person */
.profile{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:26px 28px;display:flex;flex-direction:column;gap:22px;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.who{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.who .av{width:64px;height:64px;border-radius:16px;font-size:20px}
.who-txt{flex:1;min-width:220px}
.who h2{font-family:var(--serif);font-weight:400;font-size:36px;margin-top:4px}
.who p{margin:2px 0 0;color:var(--muted)}
.started{display:inline-flex;align-items:center;gap:6px}
.started svg{width:14px;height:14px}
.fresh{font-size:13px;font-weight:700;color:var(--brand-dark);background:var(--tint);border-radius:999px;padding:6px 12px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat.good b{color:var(--good)} .stat.bad b{color:var(--bad)}

/* Attendance: today, month numbers, calendar, daily check-in and check-out */
.att{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:24px 28px;display:flex;flex-direction:column;gap:18px}
.att-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.att-head h2{font-family:var(--serif);font-weight:400;font-size:30px;margin-top:4px}
.mnav{display:flex;align-items:center;gap:10px}
.mnav b{min-width:140px;text-align:center;font-size:15px}
.mbtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0 0 2px}
.mbtn:hover:not(:disabled){border-color:var(--brand)}
.mbtn:disabled{opacity:.35;cursor:default}
.today{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:16px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line)}
.today .tic{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--tint);color:var(--muted)}
.today .tic svg{width:20px;height:20px}
.today .tx{flex:1;min-width:200px}
.today .tx b{display:block;font-size:16px}
.today .tx span{color:var(--muted);font-size:14px}
.today small{color:var(--muted);font-size:12.5px}
.today.present .tic{background:var(--good-bg);color:var(--good)} .today.late .tic{background:var(--orange-bg);color:var(--orange)} .today.absent .tic{background:var(--bad-bg);color:var(--bad)} .today.leave .tic{background:var(--grey-bg);color:var(--grey)}
.stat small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.stat.warn b{color:var(--orange)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.cell{min-height:60px;border-radius:12px;padding:7px 9px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;border:1px solid transparent;font-size:12px}
.cell .dn{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}
.cell .dn svg{width:13px;height:13px}
.cell .tm{font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.cell.present{background:var(--good-bg);color:var(--good)} .cell.late{background:var(--orange-bg);color:var(--orange)} .cell.absent{background:var(--bad-bg);color:var(--bad)} .cell.leave{background:var(--grey-bg);color:var(--grey)}
.cell.off,.cell.none{color:var(--muted);opacity:.5}
.cell.future,.cell.notin{border:1.5px dashed var(--line-2);color:var(--muted)}
.cell.is-today{box-shadow:0 0 0 2px var(--brand)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.legend i.present{background:var(--good)} .legend i.late{background:var(--orange)} .legend i.absent{background:var(--bad)} .legend i.leave{background:var(--grey)} .legend i.off{border:1.5px dashed var(--line-2)}
.tw{overflow-x:auto}
.atable{width:100%;border-collapse:collapse;font-size:14px}
.atable th{white-space:nowrap;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.atable td{padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.atable tr:last-child td{border-bottom:0}
.ast{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.ast svg{width:12px;height:12px}
.ast.present{background:var(--good-bg);color:var(--good)} .ast.late{background:var(--orange-bg);color:var(--orange)} .ast.absent{background:var(--bad-bg);color:var(--bad)} .ast.leave{background:var(--grey-bg);color:var(--grey)}
.note{margin:0;font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 14px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:800;text-decoration:underline}
.more{align-self:flex-start}
/* Live status on each team card */
.tstat{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tstat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tstat.present{background:var(--good-bg);color:var(--good)} .tstat.late{background:var(--orange-bg);color:var(--orange)} .tstat.absent{background:var(--bad-bg);color:var(--bad)} .tstat.leave{background:var(--grey-bg);color:var(--grey)} .tstat.notyet,.tstat.off{background:var(--surface-2);color:var(--muted)}
.tab[aria-selected="true"] .tstat{background:rgba(255,255,255,.16);color:#fff}

/* Updates: filters, search, timeline */
#details{display:flex;flex-direction:column;gap:18px}
.upd-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:12px}
.upd-head h2{font-family:var(--serif);font-weight:400;font-size:30px;margin-top:4px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:700;font-size:13px}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}}
.chip span{margin-left:6px;opacity:.75;font-weight:600}
.fwrap{position:relative}
.chip.fbtn{display:inline-flex;align-items:center;gap:6px}
.fbtn svg{width:15px;height:15px;flex:none}
.fbtn .chev{width:14px;height:14px;opacity:.75}
.fmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.fmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;font-weight:700;font-size:13px;text-align:left}
.fmenu button:hover,.fmenu button:focus-visible{background:var(--surface-2)}
.fmenu .n{margin-left:auto;color:var(--muted);font-weight:600}
.fmenu .tick{width:14px;color:var(--brand);font-weight:800}
.search{position:relative;width:280px}
.search svg{position:absolute;left:13px;top:50%;width:16px;height:16px;margin-top:-8px;color:var(--muted);pointer-events:none}
.search input{padding-left:38px}

.tl{display:flex;flex-direction:column;gap:14px}
.month{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px 0 10px}
.day{display:grid;grid-template-columns:150px 36px minmax(0,1fr);grid-template-areas:"date rail cards"}
.day-date{grid-area:date;text-align:right;padding-top:16px}
.day-date b{display:block;font-size:16px;font-weight:800}
.day-date span{font-size:12px;color:var(--muted)}
.rail{grid-area:rail;position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--brand);opacity:.4}
.day.first .rail::before{top:24px}
.day.last .rail::before{bottom:auto;height:24px}
.day.first.last .rail::before{display:none}
.rail i{position:relative;margin-top:18px;width:14px;height:14px;border-radius:50%;border:2px solid var(--brand);background:var(--bg);z-index:1}
.cards{grid-area:cards;display:flex;flex-direction:column;gap:12px;padding:4px 0 22px;min-width:0}
.day.last .cards{padding-bottom:4px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 22px;box-shadow:var(--shadow-sm)}
.entry.planned{border:1.5px dashed var(--line-2);background:transparent;box-shadow:none}
.labels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.label.red{background:var(--bad-bg);color:var(--bad)} .label.green{background:var(--good-bg);color:var(--good)} .label.orange{background:var(--orange-bg);color:var(--orange)} .label.grey{background:var(--grey-bg);color:var(--grey)} .label.forest{background:var(--start-bg);color:var(--start)}
.label.plain{background:none;border:1px solid var(--line-2);color:var(--muted)}
.entry h3{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.entry p{margin:6px 0 0;color:var(--muted);line-height:1.65;max-width:80ch;overflow-wrap:anywhere;white-space:pre-line}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.file{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:700;max-width:100%}
.file:hover{border-color:var(--brand)}
.file svg{width:15px;height:15px;color:var(--brand);flex:none}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{color:var(--muted);font-weight:700;font-size:11px;background:var(--surface);border-radius:6px;padding:1px 6px}
.meta{font-size:12.5px;color:var(--muted);margin-top:12px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:18px;color:var(--muted);text-align:center;padding:30px 20px}
.foot{text-align:center;font-size:12.5px;color:var(--muted);padding:6px 0 0}

@media (max-width:900px){
  .hero .in{grid-template-columns:1fr}
  .hero h1{font-size:38px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:640px){
  .nav-right .lbl{display:none}
  .mitems li+li{display:none}
  .live .txt{display:none}
  .stats .stat:last-child{grid-column:span 2}
  .att{padding:20px 16px}
  .att-head h2{font-size:26px}
  .mnav b{min-width:120px}
  .cal{gap:4px}
  .cell{min-height:42px;padding:5px 6px;border-radius:9px}

  .cell .dn svg{width:11px;height:11px}
  .mitems li:first-child{flex:1}

  .mline{flex-direction:column;align-items:flex-start;gap:2px}
  .mline .sep{display:none}

  .mline b{padding-left:16px}
  .hero{padding:30px 0 24px}
  .hero h1{font-size:32px}
  /* Team cards scroll sideways on phones so switching stays one tap */
  .team{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:-8px -20px 0;padding-left:20px;padding-right:20px}

  .profile{padding:20px 18px}

  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{width:100%}
  .day{grid-template-columns:22px minmax(0,1fr);grid-template-areas:"rail date" "rail cards";column-gap:10px}
  .day-date{text-align:left;padding-top:8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .rail i{margin-top:12px}
  .day.first .rail::before{top:18px}

}

<script>

const CLIENT='Example client';

const ICON={

  funnel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',

// ---------- Example data ----------
// Ikra follows Yessid's Loom (started 10 September, YouTube warning, great work, probation review).
// Hamza, Sara and Bilal are invented examples.
const EMPLOYEES=[
  {id:'ikra',name:'Ikra',role:'Virtual Assistant',start:'2026-09-10'},

  {emp:'ikra',type:'started',date:'2026-09-10',title:'Ikra started · day zero',text:'First day. Introduction call with the client and accounts set up.'},
  {emp:'ikra',type:'warning',date:'2026-09-15',title:'Watching YouTube during work hours',text:'We saw Ikra watching YouTube during work hours. We spoke with her the same day.\nAgreed: when she has no work, she asks for the next task, and keeps personal browsing for breaks.',files:[{name:'Activity report 14 Sep.csv',csv:[['Date','Website','Time'],['14 Sep 2026','youtube.com','1h 40m'],['14 Sep 2026','shopify.com','4h 05m'],['14 Sep 2026','gmail.com','1h 10m']]}]},

  {emp:'hamza',type:'great',date:'2026-06-03',title:'Checkout bug fixed within a day',text:'Customers could not apply discount codes. Hamza found the cause and fixed it the same day.'},
  {emp:'hamza',type:'great',date:'2026-06-24',title:'Summer sale theme delivered early',text:'Ready three days before the deadline, so the client could test calmly.'},
  {emp:'hamza',type:'probation',date:'2026-07-08',title:'Probation review: passed',text:'Strong technical work and good communication. Probation completed.',files:[{name:'Probation review Hamza.pdf',pdf:['Probation review - Hamza Ali','Date: 8 July 2026','Outcome: passed','Strengths: fast fixes, clear communication','To improve: share daily status updates']}]},
  {emp:'hamza',type:'warning',date:'2026-07-29',title:'Missed two daily status updates',text:'Two days without an end-of-day update to the client. We spoke with Hamza.\nAgreed: a short update every day at 17:00.'},
  {emp:'hamza',type:'great',date:'2026-08-19',title:'Homepage much faster',text:'Load time went from 4.1 to 1.9 seconds after his image and script clean-up.'},
  {emp:'hamza',type:'great',date:'2026-09-12',title:'New product page template launched',text:'Used on all new products from now on. The client called it the best version so far.'},
  {emp:'hamza',type:'update',date:'2026-09-26',title:'Monthly check-in',text:'Workload is good. Next focus: the Black Friday theme.',files:[{name:'Monthly report September.pdf',pdf:['Monthly report - Hamza Ali - September 2026','Tasks finished: 38','Bugs fixed: 11','Daily updates sent: 21 of 21','Next month: Black Friday theme']}]},

  {emp:'sara',type:'started',date:'2026-07-01',title:'Sara started · day zero',text:'Customer support for the web shop. Trained on the helpdesk and the return policy.'},
  {emp:'sara',type:'warning',date:'2026-07-15',title:'Late for three shifts',text:'Internet outages in her area. We spoke with Sara.\nAgreed: mobile data as a backup connection.'},
  {emp:'sara',type:'warning',date:'2026-07-28',title:'Slow replies to customers',text:'Average reply time was 6 hours, the target is 2 hours. Extra training planned.',files:[{name:'Reply times July.csv',csv:[['Week','Average reply time (hours)','Target (hours)'],['Week 28','5.5','2'],['Week 29','6.4','2'],['Week 30','6.1','2']]}]},
  {emp:'sara',type:'update',date:'2026-08-12',title:'Helpdesk training completed',text:'Two sessions on templates and priorities with our support lead.'},
  {emp:'sara',type:'great',date:'2026-08-26',title:'Reply time back under 2 hours',text:'Average reply time this month: 1 hour 40 minutes.'},

  {emp:'bilal',type:'warning',date:'2026-09-08',title:'Missed a deadline',text:'Product photos for the new collection were two days late. We spoke with Bilal.\nAgreed: he warns us at least a day ahead when something will be late.'},
  {emp:'bilal',type:'warning',date:'2026-09-17',title:'Designs not following the brand guide',text:'Wrong fonts and colours on three social posts. We went through the brand guide together.',files:[{name:'Brand guide checklist.pdf',pdf:['Brand guide checklist','1. Use only the brand fonts','2. Use only the brand colours','3. Logo with clear space around it','4. Check every post against this list before sending']}]},
  {emp:'bilal',type:'update',date:'2026-09-25',title:'Weekly check-in',text:'He now checks each design against the brand guide. Next review on 9 October.'},
  {emp:'bilal',type:'probation',date:'2026-10-09',title:'Probation review conversation',text:'Planned: deadlines, brand guide, and whether probation continues.'},
].map((x,i)=>({...x,id:'u'+i,files:x.files||[]}));

// What Remote Opus management did with each person (written in our own portal, shown here read-only).
// Example data: "ago" is days before today, so the example always looks current.
const MGMT_KINDS={
  appreciate:{label:'Appreciation',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>'},
  check:{label:'Check-in',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'},
  talk:{label:'One-to-one',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>'},
};
const MGMT=[
  {ago:0,emp:'ikra',kind:'check',title:'Checked Ikra’s work and hours',text:'All of today’s tasks are on track.'},
  {ago:0,emp:'hamza',kind:'appreciate',title:'Appreciated Hamza',text:'For the new product page template.'},
  {ago:1,emp:'bilal',kind:'talk',title:'One-to-one with Bilal',text:'Deadlines: he now warns a day ahead when something will be late.'},
  {ago:2,emp:'sara',kind:'appreciate',title:'Appreciated Sara',text:'For the 5-star review a customer wrote about her.'},
  {ago:3,emp:'sara',kind:'check',title:'Checked Sara’s reply times',text:'Average 1 hour 35 minutes, under the 2-hour target.'},
  {ago:4,emp:'bilal',kind:'check',title:'Checked Bilal’s designs',text:'All new posts follow the brand guide.'},
  {ago:6,emp:'ikra',kind:'talk',title:'Weekly one-to-one with Ikra',text:'Going well. She now asks for the next task when she is free.'},

].map((x,i)=>({...x,id:'m'+i,by:'Floor manager'}));

// Attendance (example data). One record per working day from the start date up to today.
// Leave and absence are set per person as "working days ago" (0 = today); the rest is generated
// the same way every time, so a given day always shows the same times.
const SHIFT={start:9*60,lateAfter:9*60+10,len:8*60+30};
const ATT_PROFILE={
  ikra:{late:.10,leave:{4:'Sick leave'},absent:[]},
  hamza:{late:.03,leave:{12:'Annual leave',13:'Annual leave'},absent:[]},
  sara:{late:.08,lateBefore:{date:'2026-08-01',p:.4},leave:{0:'Annual leave',1:'Annual leave'},absent:[]},
  bilal:{late:.15,leave:{7:'Sick leave'},absent:[9]},
};

// ---------- Helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isoToday=()=>isoOf(new Date());
const toDate=d=>new Date(d+'T00:00:00');
const diffDays=(a,b)=>Math.round((toDate(a)-toDate(b))/86400000);
const fmt=(d,o)=>toDate(d).toLocaleDateString('en-GB',o);
const ini=n=>String(n).trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const ago=n=>n===0?'today':n===1?'yesterday':`${n} days ago`;
const plural=(n,w,p)=>`${n} ${n===1?w:(p||w+'s')}`;
const emp=id=>EMPLOYEES.find(e=>e.id===id);
const entriesOf=id=>ENTRIES.filter(x=>x.emp===id);
function lastUpdate(id){const t=isoToday();const ds=entriesOf(id).map(x=>x.date).filter(d=>d<=t).sort();return ds.length?ds[ds.length-1]:null}
// Search highlight on the raw text, escaping each piece
function hl(s){s=String(s??'');if(!UI.q)return esc(s);const q=UI.q.toLowerCase(),low=s.toLowerCase();let out='',i=0,j;while(q&&(j=low.indexOf(q,i))>-1){out+=esc(s.slice(i,j))+'<mark>'+esc(s.slice(j,j+q.length))+'</mark>';i=j+q.length}return out+esc(s.slice(i))}

// ---------- Attachments: built on click from the example content ----------
function makePdf(lines){
  const e=s=>s.replace(/[\\()]/g,'\\$&');
  const ops=['BT','/F1 18 Tf','56 780 Td','('+e(lines[0])+') Tj','/F1 12 Tf'];
  lines.slice(1).forEach((l,i)=>ops.push(i===0?'0 -34 Td':'0 -22 Td','('+e(l)+') Tj'));
  ops.push('ET');const stream=ops.join('\n');
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];
  let out='%PDF-1.4\n';const offs=[];objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return new Blob([out],{type:'application/pdf'});
}
const csvBlob=rows=>new Blob([rows.map(r=>r.map(c=>/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c).join(',')).join('\r\n')],{type:'text/csv'});
function openFile(entryId,i){
  const f=(ENTRIES.find(x=>x.id===entryId)||{}).files?.[i];if(!f)return;
  const blob=f.pdf?makePdf(f.pdf):csvBlob(f.csv);const url=URL.createObjectURL(blob);
  if(f.pdf){window.open(url,'_blank','noopener')}
  else{const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

// ---------- View state: one person open at a time (first by default, or the one in the link) ----------
const UI={open:(EMPLOYEES.find(e=>'#'+e.id===location.hash)||EMPLOYEES[0]).id,type:'',q:'',attMonth:null,attAll:false};
function pick(id,focus){if(UI.open===id)return;UI.open=id;UI.type='';UI.q='';UI.attAll=false;try{history.replaceState(null,'','#'+id)}catch(e){}render();if(focus){const t=document.getElementById('tab-'+id);t&&t.focus()}}
// Keep the selected card visible in the sideways-scrolling team row on phones
function revealTab(){const t=document.getElementById('tab-'+UI.open),row=t&&t.parentElement;if(row&&row.scrollWidth>row.clientWidth)row.scrollLeft=t.offsetLeft-row.offsetLeft-20}

// ---------- Management activity ----------
const mDate=m=>isoOf(new Date(toDate(isoToday()).getTime()-m.ago*86400000));
const mWhen=m=>m.ago===0?'today':m.ago===1?'yesterday':`${m.ago} days ago`;
const mgmtOf=id=>MGMT.filter(m=>m.emp===id).sort((a,b)=>a.ago-b.ago);
function mgmtBar(){
  const list=MGMT.slice().sort((a,b)=>a.ago-b.ago);
  $('#mitems').innerHTML=list.slice(0,3).map(m=>`<li><button type="button" class="mitem" onclick="openFromMgmt('${m.emp}')"><span class="mic">${MGMT_KINDS[m.kind].icon}</span><span class="mt">${esc(m.title)}</span><small>· ${mWhen(m)}</small></button></li>`).join('');

  const groups=[['Today',m=>m.ago===0],['Yesterday',m=>m.ago===1],['This week',m=>m.ago>1&&m.ago<7],['Earlier',m=>m.ago>=7]];
  $('#mpanel').innerHTML=groups.map(([h,f])=>{const g=list.filter(f);return g.length?`<h4>${h}</h4>`+g.map(m=>`<button type="button" class="mrow" onclick="openFromMgmt('${m.emp}')"><span class="mic k-${m.kind}">${MGMT_KINDS[m.kind].icon}</span><span><b>${esc(m.title)}</b><span class="t">${esc(m.text)}</span><small>${MGMT_KINDS[m.kind].label} · ${esc(m.by)} · ${mWhen(m)}</small></span></button>`).join(''):''}).join('');
}
function toggleMgmt(open){const p=$('#mpanel'),b=$('#mall');open=open===undefined?p.hidden:open;p.hidden=!open;b.setAttribute('aria-expanded',String(open));if(open){const r=p.querySelector('.mrow');r&&r.focus()}}
function openFromMgmt(id){toggleMgmt(false);pick(id);revealTab();const d=$('#details');d&&d.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
// ---------- Attendance ----------
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dShort=d=>`${WD[toDate(d).getDay()]} ${+d.slice(8)} ${MON[+d.slice(5,7)-1]}`;
const isWork=d=>{const w=toDate(d).getDay();return w>0&&w<6};
const hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const dur=m=>`${Math.floor(m/60)}h ${pad(m%60)}m`;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function rnd(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);h^=h>>>13;h=Math.imul(h,1540483477);h^=h>>>15;return (h>>>0)/4294967296}
const ATT_ICON={
  present:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  late:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  absent:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>',
  leave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 18 0z"/><path d="M12 12v6.5a2 2 0 0 1-4 0"/></svg>',
};
const ATT_LABEL={present:'Present',late:'Late',absent:'Absent',leave:'Leave'};
const ATT_CACHE={};
function attendance(e){
  const t=isoToday(),key=e.id+t;if(ATT_CACHE[key])return ATT_CACHE[key];
  const days=[];for(let d=toDate(e.start);isoOf(d)<=t;d.setDate(d.getDate()+1)){const iso=isoOf(d);if(isWork(iso))days.push(iso)}
  const P=ATT_PROFILE[e.id]||{late:.05,leave:{},absent:[]};const n=days.length;
  return ATT_CACHE[key]=days.map((date,i)=>{const back=n-1-i;
    if(P.leave[back])return {date,status:'leave',note:P.leave[back]};
    if(P.absent.includes(back))return {date,status:'absent',note:'Did not show up, not reported'};
    const p=P.lateBefore&&date<P.lateBefore.date?P.lateBefore.p:P.late;const late=rnd(e.id+date)<p;
    const tin=late?SHIFT.lateAfter+6+Math.floor(rnd(date+e.id)*25):SHIFT.start-9+Math.floor(rnd(date+e.id)*17);
    const tout=tin+SHIFT.len-10+Math.floor(rnd(date+e.id+'out')*35);
    return {date,status:late?'late':'present',in:tin,out:tout,mins:tout-tin};
  });
}
// Today follows the real clock: not in yet before the check-in time, still working until check-out
function live(r){if(!r||r.date!==isoToday()||r.in==null)return r;const n=nowMin();if(n<r.in)return {date:r.date,status:'notyet'};if(n<r.out)return {...r,out:null,mins:n-r.in,working:true};return r}
function todayStatus(e){
  const t=isoToday();
  if(t<e.start)return {k:'off',short:'Starts '+dShort(e.start),title:'Not started yet',long:'First day: '+fmt(e.start,{day:'numeric',month:'long'})};
  if(!isWork(t))return {k:'off',short:'Weekend',title:'Weekend',long:'No shift today'};
  const r=live(attendance(e).find(x=>x.date===t));
  if(!r||r.status==='notyet')return {k:'notyet',short:'Not in yet',title:'Not checked in yet',long:`Shift starts at ${hm(SHIFT.start)}`};
  if(r.status==='leave')return {k:'leave',short:'On leave',title:'On leave',long:r.note};
  if(r.status==='absent')return {k:'absent',short:'Absent',title:'Absent',long:r.note};
  const late=r.status==='late'?' · late':'';
  if(r.working)return {k:r.status,short:`In since ${hm(r.in)}`,title:r.status==='late'?'Present · arrived late':'Present',long:`Checked in ${hm(r.in)}${late} · working now, ${dur(r.mins)} so far`};
  return {k:r.status,short:`Out ${hm(r.out)}`,title:r.status==='late'?'Present · arrived late':'Present',long:`Checked in ${hm(r.in)}${late} · checked out ${hm(r.out)} · ${dur(r.mins)}`};
}
function setAttMonth(m){if(!m)return;UI.attMonth=m;UI.attAll=false;renderDetails()}
function attendanceHTML(e){
  const t=isoToday();const all=attendance(e).map(live);const ts=todayStatus(e);
  const months=[...new Set(all.map(r=>r.date.slice(0,7)))];
  const todayBox=`<div class="today ${ts.k}"><span class="tic">${ATT_ICON[ts.k]||ATT_ICON.late}</span><div class="tx"><b>Today: ${esc(ts.title)}</b><span>${esc(ts.long)}</span></div><small>Shift ${hm(SHIFT.start)} – ${hm(SHIFT.start+SHIFT.len)} · times in your time zone</small></div>`;
  const head=(nav)=>`<div class="att-head"><div><div class="eyebrow">Attendance</div><h2 id="att-h">Present &amp; absent</h2></div>${nav}</div>`;
  if(!months.length)return `<section class="att" aria-labelledby="att-h">${head('')}${todayBox}</section>`;
  const ym=months.includes(UI.attMonth)?UI.attMonth:months[months.length-1];const mi=months.indexOf(ym);
  const monthName=m=>fmt(m+'-01',{month:'long',year:'numeric'});
  const recs=all.filter(r=>r.date.slice(0,7)===ym&&r.status!=='notyet');const n=k=>recs.filter(r=>r.status===k).length;
  const done=recs.filter(r=>r.mins&&!r.working);const avg=done.length?Math.round(done.reduce((a,r)=>a+r.mins,0)/done.length):null;
  const ins=recs.filter(r=>r.in!=null);const avgIn=ins.length?Math.round(ins.reduce((a,r)=>a+r.in,0)/ins.length):null;
  // Month calendar, Monday first
  const first=toDate(ym+'-01');const lead=(first.getDay()+6)%7;const dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  const byDate=Object.fromEntries(all.filter(r=>r.date.slice(0,7)===ym).map(r=>[r.date,r]));
  let cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="wd" aria-hidden="true">${w}</div>`).join('')+'<div aria-hidden="true"></div>'.repeat(lead);
  for(let d=1;d<=dim;d++){const iso=`${ym}-${pad(d)}`,r=byDate[iso];let cls,ic='',tm='',tip=dShort(iso);
    if(!isWork(iso)){cls='off';tip+=' · weekend'}
    else if(iso<e.start){cls='none';tip+=' · before first day'}
    else if(iso>t){cls='future';tip+=' · upcoming'}
    else if(!r||r.status==='notyet'){cls='notin';tip+=' · not checked in yet'}
    else{cls=r.status;ic=ATT_ICON[r.status];tm=r.in!=null?hm(r.in):ATT_LABEL[r.status];tip+=` · ${r.status==='leave'?r.note:ATT_LABEL[r.status]}${r.in!=null?` · ${hm(r.in)} – ${r.out!=null?hm(r.out):'now'}`:''}`}
    cells+=`<div class="cell ${cls}${iso===t?' is-today':''}" title="${esc(tip)}"><span class="dn">${d}${ic}</span>${tm?`<span class="tm">${tm}</span>`:''}</div>`}
  // Daily list, newest first
  const rows=recs.slice().reverse();const shown=UI.attAll?rows:rows.slice(0,5);
  const tr=shown.map(r=>`<tr><td>${dShort(r.date)}${r.date===t?' (today)':''}</td><td><span class="ast ${r.status}">${ATT_ICON[r.status]}${esc(r.status==='leave'?r.note:ATT_LABEL[r.status])}</span></td><td>${r.in!=null?hm(r.in):'—'}</td><td>${r.in!=null?(r.out!=null?hm(r.out):'Working now'):'—'}</td><td>${r.mins?dur(r.mins):'—'}</td></tr>`).join('');
  const early=mi===months.length-1&&mi>0&&recs.length<5;
  const nav=`<div class="mnav"><button type="button" class="mbtn" onclick="setAttMonth('${months[mi-1]||''}')" ${mi>0?'':'disabled'} aria-label="Previous month">‹</button><b>${monthName(ym)}</b><button type="button" class="mbtn" onclick="setAttMonth('${months[mi+1]||''}')" ${mi<months.length-1?'':'disabled'} aria-label="Next month">›</button></div>`;
  return `<section class="att" aria-labelledby="att-h">${head(nav)}${todayBox}
  <div class="stats"><div class="stat good"><b>${n('present')+n('late')}</b><span>Days present</span></div><div class="stat warn"><b>${n('late')}</b><span>Late arrivals</span></div><div class="stat bad"><b>${n('absent')}</b><span>Absent</span></div><div class="stat"><b>${n('leave')}</b><span>Leave days</span></div><div class="stat"><b>${avg?dur(avg):'–'}</b><span>Average day</span>${avgIn!=null?`<small>Check-in ${hm(avgIn)} on average</small>`:''}</div></div>
  ${early?`<p class="note">${monthName(ym)} has just started. <button type="button" class="linkbtn" onclick="setAttMonth('${months[mi-1]}')">See ${fmt(months[mi-1]+'-01',{month:'long'})}</button> for a full month.</p>`:''}
  <div class="cal" aria-label="${monthName(ym)} attendance calendar">${cells}</div>
  <div class="legend" aria-hidden="true"><span><i class="present"></i>Present</span><span><i class="late"></i>Late (after ${hm(SHIFT.lateAfter)})</span><span><i class="absent"></i>Absent</span><span><i class="leave"></i>Leave</span><span><i class="off"></i>Upcoming</span></div>
  <div class="tw"><table class="atable"><thead><tr><th>Day</th><th>Status</th><th>Check-in</th><th>Check-out</th><th>Hours</th></tr></thead><tbody>${tr||'<tr><td colspan="5">No working days yet this month.</td></tr>'}</tbody></table></div>
  ${rows.length>5?`<button type="button" class="chip more" onclick="UI.attAll=!UI.attAll;renderDetails()">${UI.attAll?'Show fewer days':`Show all ${rows.length} days`}</button>`:''}
  </section>`;
}
function setType(t){UI.type=t;renderDetails()}
function setQ(v){UI.q=v;$('#tl').innerHTML=timelineHTML(emp(UI.open))}

// ---------- Rendering ----------
function summaryHTML(){
  const t=isoToday(),from=isoOf(new Date(toDate(t).getTime()-30*86400000));
  const recent=ENTRIES.filter(x=>x.date>from&&x.date<=t);const c=k=>recent.filter(x=>x.type===k).length;
  const st=EMPLOYEES.map(todayStatus);const here=st.filter(s=>s.k==='present'||s.k==='late').length;const weekend=!isWork(t);
  return `<div class="summary-head"><b>Last 30 days</b><span>${plural(EMPLOYEES.length,'person','people')}</span></div>
  <div class="srow"><span class="ic good" aria-hidden="true">${ATT_ICON.present}</span><span>Present today</span><b>${weekend?'Weekend':`${here} of ${EMPLOYEES.length}`}</b></div>
  <div class="srow"><span class="ic good" aria-hidden="true">▲</span><span>Great work</span><b>${c('great')}</b></div>
  <div class="srow"><span class="ic bad" aria-hidden="true">!</span><span>Warnings</span><b>${c('warning')}</b></div>
  <div class="srow"><span class="ic grey" aria-hidden="true">✎</span><span>All updates</span><b>${recent.length}</b></div>
  <div class="srow"><span class="ic mg" aria-hidden="true">${MGMT_KINDS.check.icon}</span><span class="lbl">Management actions</span><b>${MGMT.filter(m=>m.ago<30).length}</b></div>`;
}
function tabHTML(p){
  const t=isoToday();const lu=lastUpdate(p.id);const d=lu?diffDays(t,lu):null;const all=entriesOf(p.id);const g=all.filter(x=>x.type==='great').length,w=all.filter(x=>x.type==='warning').length;const on=UI.open===p.id;
  return `<button type="button" class="tab" role="tab" id="tab-${p.id}" aria-selected="${on}" aria-controls="details" tabindex="${on?0:-1}" onclick="pick('${p.id}')"><span class="tab-top"><span class="av">${esc(ini(p.name))}</span><span><b>${esc(p.name)}</b><small>${esc(p.role)}</small></span></span>${(()=>{const s=todayStatus(p);return `<span class="tstat ${s.k}">${esc(s.short)}</span>`})()}<span class="tab-foot"><span>${d===null?'No updates yet':'Updated '+ago(d)}</span><span class="tally"><span title="Great work"><i class="dot green"></i>${g}</span><span title="Warnings"><i class="dot red"></i>${w}</span></span></span></button>`;
}
function entryHTML(x){
  const T=TYPES[x.type]||TYPES.update;const planned=x.date>isoToday();
  const files=x.files.length?`<div class="files">${x.files.map((f,i)=>`<button type="button" class="file" onclick="openFile('${x.id}',${i})" title="Open ${esc(f.name)}">${ICON.clip}<span>${hl(f.name)}</span><small>${f.pdf?'PDF':'EXCEL'}</small></button>`).join('')}</div>`:'';
  return `<article class="entry${planned?' planned':''}"><div class="labels"><span class="label ${T.cls}">${T.label}</span>${planned?'<span class="label plain">Planned</span>':''}</div><h3>${hl(x.title)}</h3>${x.text?`<p>${hl(x.text)}</p>`:''}${files}<div class="meta">by Remote Opus</div></article>`;
}
function timelineHTML(e){
  let list=entriesOf(e.id);
  if(UI.type)list=list.filter(x=>x.type===UI.type);
  if(UI.q){const q=UI.q.toLowerCase();list=list.filter(x=>[x.title,x.text,TYPES[x.type].label,...x.files.map(f=>f.name)].join(' ').toLowerCase().includes(q))}
  if(!list.length)return `<div class="empty">Nothing matches. Try another word, or choose All.</div>`;
  list.sort((a,b)=>b.date.localeCompare(a.date));
  // Newest first: a month heading, then one row per date holding that day's updates
  const months=[];list.forEach(x=>{const m=x.date.slice(0,7);let M=months[months.length-1];if(!M||M.m!==m){M={m,days:[]};months.push(M)}let D=M.days[M.days.length-1];if(!D||D.d!==x.date){D={d:x.date,items:[]};M.days.push(D)}D.items.push(x)});
  const today=isoToday();
  const dayLabel=d=>{const n=diffDays(d,e.start);return n<0?'':n===0?'Day 0 · started':`Day ${n}${d>today?' · planned':''}`};
  return months.map(M=>`<section aria-label="${fmt(M.m+'-01',{month:'long',year:'numeric'})}"><div class="month">${fmt(M.m+'-01',{month:'long',year:'numeric'})}</div>${M.days.map((D,i)=>`<div class="day${i===0?' first':''}${i===M.days.length-1?' last':''}"><div class="day-date"><b>${fmt(D.d,{day:'numeric',month:'long'})}</b><span>${dayLabel(D.d)}</span></div><div class="rail"><i></i></div><div class="cards">${D.items.map(entryHTML).join('')}</div></div>`).join('')}</section>`).join('');
}
function detailsHTML(e){
  const all=entriesOf(e.id);const cnt=t=>all.filter(x=>x.type===t).length;
  const today=isoToday();const dn=diffDays(today,e.start);const lu=lastUpdate(e.id);const sd=lu?diffDays(today,lu):null;
  const counts={};all.forEach(x=>counts[x.type]=(counts[x.type]||0)+1);
  const menu=ORDER.map(k=>`<button type="button" role="menuitemradio" aria-checked="${UI.type===k}" onclick="setType('${k}')"><span class="tick">${UI.type===k?'✓':''}</span><span class="dot ${TYPES[k].cls}"></span>${TYPES[k].label}<span class="n">${counts[k]||0}</span></button>`).join('');
  return `<section class="profile" aria-labelledby="who-name">
    <div class="who"><span class="av">${esc(ini(e.name))}</span><div class="who-txt"><div class="eyebrow started">${ICON.cal}${dn>=0?`Started ${fmt(e.start,{day:'numeric',month:'long',year:'numeric'})} · Day ${dn}`:`Starts ${fmt(e.start,{day:'numeric',month:'long',year:'numeric'})}`}</div><h2 id="who-name">${esc(e.name)}</h2><p>${esc(e.role)} at ${esc(CLIENT)}</p></div><span class="fresh">${sd===null?'No updates yet':'Last update '+ago(sd)}</span></div>
    ${(()=>{const ms=mgmtOf(e.id);if(!ms.length)return '';const last=ms[0];const ap=ms.filter(m=>m.kind==='appreciate'&&m.ago<30).length;const ck=ms.filter(m=>m.kind==='check').sort((a,b)=>a.ago-b.ago)[0];
      return `<div class="mline"><span class="pulse" aria-hidden="true"></span><b>Management</b><span>${esc(last.title)} · ${mWhen(last)}</span><span class="sep">|</span><span>${ck?'Last check-in '+mWhen(ck):'No check-in yet'}</span><span class="sep">|</span><span>${plural(ap,'appreciation')} in the last 30 days</span></div>`})()}
    <div class="stats"><div class="stat"><b>${Math.max(0,dn)}</b><span>Days with us</span></div><div class="stat good"><b>${cnt('great')}</b><span>Great work</span></div><div class="stat bad"><b>${cnt('warning')}</b><span>Warnings</span></div><div class="stat"><b>${all.length}</b><span>Updates</span></div><div class="stat"><b>${sd===null?'–':sd===0?'Today':sd+'d'}</b><span>Since last update</span></div></div>
  </section>
  ${attendanceHTML(e)}
  <div class="upd-head"><div><div class="eyebrow">Updates</div><h2>What happened</h2></div>
    <div class="tools"><button type="button" class="chip" aria-pressed="${!UI.type}" onclick="setType('')">All<span>${all.length}</span></button><div class="fwrap"><button type="button" class="chip fbtn" id="fbtn" aria-pressed="${!!UI.type}" aria-haspopup="menu" aria-expanded="false" aria-controls="fmenu" onclick="toggleMenu()">${ICON.funnel}${UI.type?`${TYPES[UI.type].label}<span>${counts[UI.type]||0}</span>`:'Filter'}${ICON.chev}</button><div class="fmenu" id="fmenu" role="menu" aria-label="Filter by type" hidden>${menu}</div></div>
    <div class="search">${ICON.search}<input id="q" type="search" placeholder="Search what happened…" value="${esc(UI.q)}" oninput="setQ(this.value)" aria-label="Search what happened"></div></div></div>
  <div class="tl" id="tl">${timelineHTML(e)}</div>`;
}
function renderDetails(){$('#details').innerHTML=detailsHTML(emp(UI.open))}
function render(){
  $('#clientName').textContent=CLIENT;$('#clientIni').textContent=ini(CLIENT);
  $('#summary').innerHTML=summaryHTML();
  $('#app').innerHTML=`<div class="sec-head"><span class="eyebrow">Your team</span><span class="count">${plural(EMPLOYEES.length,'person','people')} · click a card to switch</span></div>
  <div class="team" role="tablist" aria-label="Your team">${EMPLOYEES.map(tabHTML).join('')}</div>
  <div id="details" role="tabpanel" aria-labelledby="tab-${UI.open}"></div>
  <p class="foot">Remote Opus · Client portal · Example data</p>`;
  renderDetails();
}

// ---------- Events ----------
function toggleMenu(open){const m=$('#fmenu'),b=$('#fbtn');if(!m)return;open=open===undefined?m.hidden:open;m.hidden=!open;b.setAttribute('aria-expanded',String(open));if(open){const first=m.querySelector('[aria-checked="true"]')||m.querySelector('button');first&&first.focus()}}
document.addEventListener('click',ev=>{if(!ev.target.closest('.fwrap'))toggleMenu(false);if(!ev.target.closest('.mbar'))toggleMgmt(false)});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('#mpanel').hidden){toggleMgmt(false);$('#mall').focus();return}
  const m=$('#fmenu');
  if(m&&!m.hidden){
    if(ev.key==='Escape'){toggleMenu(false);$('#fbtn').focus()}
    if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();const items=[...m.querySelectorAll('button')];const i=items.indexOf(document.activeElement);items[(i+(ev.key==='ArrowDown'?1:-1)+items.length)%items.length].focus()}
    return;
  }
  // Arrow keys move between team cards
  if(document.activeElement&&document.activeElement.classList.contains('tab')&&['ArrowRight','ArrowLeft','Home','End'].includes(ev.key)){
    ev.preventDefault();const i=EMPLOYEES.findIndex(e=>e.id===UI.open),n=EMPLOYEES.length;
    const j=ev.key==='Home'?0:ev.key==='End'?n-1:(i+(ev.key==='ArrowRight'?1:-1)+n)%n;pick(EMPLOYEES[j].id,true);
  }
});
addEventListener('hashchange',()=>{const e=EMPLOYEES.find(x=>'#'+x.id===location.hash);if(e){pick(e.id);revealTab()}});

mgmtBar();render();revealTab();
</script>
</body>
</html>
