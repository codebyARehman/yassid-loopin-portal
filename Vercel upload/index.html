<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loopin Employee Updates</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Client-facing update history per employee, built only from Yessid's Loom "Client Backlog Updates for Ikra".
   Look follows the ChannelDock changelog shown in that video: month headings, dates on a vertical line,
   plain cards with a coloured type label, filter buttons and a search box. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f6; --fg:#0f172a; --muted:#5b6478; --line:#e1e6ee;
  --navy:#0b1526; --navy-fg:#e6ebf3; --navy-muted:#8b97ad; --accent:#f5c542; --accent-fg:#1a1600; --brand:#1a6bff;
  --green:#1f8a57; --green-bg:#e3f6ec; --red:#c93b3a; --red-bg:#fde8e7; --amber:#a86a00; --amber-bg:#fff2d6;
  --blue:#1a5fe0; --blue-bg:#e8f0ff; --grey:#4b5568; --grey-bg:#eef1f6; --mark:#fff0b3;
  --pri:#0b1526; --pri-fg:#ffffff;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131c2e; --surface-2:#1a2539; --fg:#e8edf6; --muted:#9aa5ba; --line:#27324a;
  --navy:#070d19; --brand:#5b93ff;
  --green:#4cc98f; --green-bg:#12331f; --red:#ff8584; --red-bg:#3d1615; --amber:#f0b34a; --amber-bg:#3b2a05;
  --blue:#7fa8ff; --blue-bg:#132649; --grey:#b3bdcf; --grey-bg:#1f2a40; --mark:#5a4a10; --pri:#f5c542; --pri-fg:#1a1600; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131c2e; --surface-2:#1a2539; --fg:#e8edf6; --muted:#9aa5ba; --line:#27324a;
  --navy:#070d19; --brand:#5b93ff;
  --green:#4cc98f; --green-bg:#12331f; --red:#ff8584; --red-bg:#3d1615; --amber:#f0b34a; --amber-bg:#3b2a05;
  --blue:#7fa8ff; --blue-bg:#132649; --grey:#b3bdcf; --grey-bg:#1f2a40; --mark:#5a4a10; --pri:#f5c542; --pri-fg:#1a1600; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* Top bar */
.top{background:var(--navy);color:var(--navy-fg);padding:12px 16px}
.top-in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.8px;color:#fff}
.brand small{color:var(--navy-muted);font-size:13px;font-weight:500}
.viewas{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--navy-muted)}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--navy-fg);padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* Page */
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:26px;font-weight:800}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.head-actions label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.head-actions select{width:auto;min-width:200px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-fg)}
.btn.primary:hover{opacity:.9}
.btn.sm{padding:6px 11px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:12px;text-decoration:underline}
.link:hover{color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.empty{color:var(--muted);text-align:center;padding:28px 20px}

/* Employees */
.people{display:flex;gap:10px;flex-wrap:wrap}
.person{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 16px 8px 8px;text-align:left;min-width:0}
.person:hover{background:var(--surface-2)}
.person.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.person b{display:block;font-size:14px}
.person span span{display:block;font-size:12px;color:var(--muted)}
.person .stale{color:var(--red);font-weight:600}
.av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}

/* Header card, like the changelog header */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.hero-main{flex:1 1 320px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.eyebrow svg{width:14px;height:14px;flex:none}
.hero h2{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.4px}
.hero p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;align-items:center;min-width:62px}
.stats b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.red-txt{color:var(--red)}
.nudge{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--red-bg);color:var(--fg);border-radius:12px;padding:12px 16px}
.nudge b{color:var(--red)}

/* Form */
.form{display:grid;gap:12px}
.form h3{font-size:17px}
.form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.form .hint{margin:0;font-size:12px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* Filters and search */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip span{margin-left:6px;opacity:.7;font-weight:500}
/* One "Filter" button; the type choices live in its menu */
.fwrap{position:relative}
.chip.fbtn{display:inline-flex;align-items:center;gap:6px}
.fbtn svg{width:15px;height:15px;flex:none}
.fbtn .chev{width:14px;height:14px;opacity:.7}
.fmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.16);padding:6px;display:flex;flex-direction:column}
.fmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;font-weight:600;font-size:13px;text-align:left}
.fmenu button:hover,.fmenu button:focus-visible{background:var(--surface-2)}
.fmenu .dot{width:9px;height:9px;border-radius:50%;flex:none}
.fmenu .dot.red{background:var(--red)} .fmenu .dot.green{background:var(--green)} .fmenu .dot.amber{background:var(--amber)} .fmenu .dot.blue{background:var(--blue)} .fmenu .dot.grey{background:var(--grey)}
.fmenu .n{margin-left:auto;color:var(--muted);font-weight:500}
.fmenu .tick{width:14px;color:var(--brand);font-weight:800}
.search{position:relative;flex:0 1 320px;min-width:220px}
.search svg{position:absolute;left:11px;top:50%;width:16px;height:16px;margin-top:-8px;color:var(--muted);pointer-events:none}
.search input{padding-left:34px;border-radius:999px}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:14px}
.month{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px 0 10px}
.day{display:grid;grid-template-columns:150px 36px minmax(0,1fr);grid-template-areas:"date rail cards"}
.day-date{grid-area:date;text-align:right;padding-top:14px}
.day-date b{display:block;font-size:16px;font-weight:700}
.day-date span{font-size:12px;color:var(--muted)}
.rail{grid-area:rail;position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--brand);opacity:.45}
.day.first .rail::before{top:22px}
.day.last .rail::before{bottom:auto;height:22px}
.day.first.last .rail::before{display:none}
.rail i{position:relative;margin-top:16px;width:14px;height:14px;border-radius:50%;border:2px solid var(--brand);background:var(--bg);z-index:1}
.cards{grid-area:cards;display:flex;flex-direction:column;gap:12px;padding:4px 0 22px;min-width:0}
.day.last .cards{padding-bottom:4px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.entry.planned{border-style:dashed;background:transparent;box-shadow:none}
.labels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.label.red{background:var(--red-bg);color:var(--red)} .label.green{background:var(--green-bg);color:var(--green)} .label.amber{background:var(--amber-bg);color:var(--amber)} .label.blue{background:var(--blue-bg);color:var(--blue)} .label.grey{background:var(--grey-bg);color:var(--grey)}
.label.plain{background:none;border:1px solid var(--line);color:var(--muted)}
.entry h3{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.entry p{margin:6px 0 0;color:var(--muted);line-height:1.6;max-width:80ch;overflow-wrap:anywhere;white-space:pre-line}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.file{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600;max-width:100%}
.file:hover{border-color:var(--brand)}
.file svg{width:15px;height:15px;color:var(--brand);flex:none}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{color:var(--muted);font-weight:500}
.meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:12px}

.foot{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);padding-top:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1}

@media (max-width:700px){
  .head h1{font-size:22px}
  .hero{padding:18px}
  .hero h2{font-size:24px}
  .stats{gap:14px}
  .search{flex:1 1 100%}
  .day{grid-template-columns:22px minmax(0,1fr);grid-template-areas:"rail date" "rail cards";column-gap:10px}
  .day-date{text-align:left;padding-top:8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .rail i{margin-top:12px}
  .day.first .rail::before{top:18px}
  .day.last .rail::before{height:18px}
  .entry{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="logo">Loopin</span><small>Employee updates</small></div>
    <div class="viewas">Viewing as
      <div class="seg" role="group" aria-label="View as">
        <button type="button" data-view="client" onclick="setView('client')">Client</button>
        <button type="button" data-view="team" onclick="setView('team')">Loopin team</button>
      </div>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ---------- Settings ----------
const KEY='yassid-loopin-portal-v1';
const STALE_DAYS=7; // Loopin team sees a red flag when an employee has no update for longer than this
const TYPES={
  warning:{label:'Warning',cls:'red'},
  great:{label:'Great work',cls:'green'},
  update:{label:'Update',cls:'grey'},
  probation:{label:'Probation review',cls:'amber'},
  started:{label:'Started',cls:'blue'},
};
const CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
const SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
const FUNNEL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>';
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const CLIP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>';

// ---------- Helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const isoToday=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const toDate=d=>new Date(d+'T00:00:00');
const diffDays=(a,b)=>Math.round((toDate(a)-toDate(b))/86400000);
const fmt=(d,o)=>toDate(d).toLocaleDateString('en-GB',o);
const ini=n=>String(n).trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const ago=n=>n===0?'today':n===1?'yesterday':`${n} days ago`;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
// Search highlight on the raw text, escaping each piece
function hl(s){s=String(s??'');if(!UI.q)return esc(s);const q=UI.q.toLowerCase(),low=s.toLowerCase();let out='',i=0,j;while(q&&(j=low.indexOf(q,i))>-1){out+=esc(s.slice(i,j))+'<mark>'+esc(s.slice(j,j+q.length))+'</mark>';i=j+q.length}return out+esc(s.slice(i))}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- Attachments: kept in this browser's IndexedDB so they can be opened again ----------
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('yassid-loopin-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function putFile(id,blob){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(blob,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function getFile(id){const d=await db();return new Promise((res,rej)=>{const r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dropFiles(ids){try{const d=await db();const t=d.transaction('files','readwrite');ids.forEach(id=>t.objectStore('files').delete(id))}catch(e){}}
async function clearFiles(){try{const d=await db();d.transaction('files','readwrite').objectStore('files').clear()}catch(e){}}

// ---------- Data ----------
// Example data follows the Loom: Ikra starts 10 September (day zero), a YouTube warning, great work, a probation review.
function seed(){return{
  employees:[{id:'e1',name:'Ikra',role:'Virtual Assistant',client:'Example client',start:'2026-09-10'}],
  entries:[
    {id:'s1',emp:'e1',type:'started',date:'2026-09-10',title:'Ikra started · day zero',text:'First day. Introduction call with the client and accounts set up.',by:'Loopin team',files:[],created:1},
    {id:'s2',emp:'e1',type:'warning',date:'2026-09-15',title:'Watching YouTube during work hours',text:'We saw Ikra watching YouTube during work hours. We spoke with her the same day.\nAgreed: when she has no work, she asks for the next task, and keeps personal browsing for breaks.',by:'Loopin team',files:[],created:2},
    {id:'s3',emp:'e1',type:'great',date:'2026-09-22',title:'Found a problem nobody had noticed',text:'She found an issue nobody had spotted and reported it straight away. Really amazing work.',by:'Loopin team',files:[],created:3},
    {id:'s4',emp:'e1',type:'probation',date:'2026-10-10',title:'Probation review conversation',text:'Conversation about her first month: what goes well, what to improve, and whether probation continues.',by:'Loopin team',files:[],created:4},
  ]}}
// A small example Excel-readable file on the warning, so attachments can be tried straight away
async function seedFiles(){
  const csv='Date,Website,Time\n14 Sep 2026,youtube.com,1h 40m\n14 Sep 2026,shopify.com,4h 05m\n14 Sep 2026,gmail.com,1h 10m\n';
  const blob=new Blob([csv],{type:'text/csv'});
  try{await putFile('f-seed-1',blob);const w=S.entries.find(x=>x.id==='s2');if(w&&!w.files.length){w.files.push({id:'f-seed-1',name:'Activity report 14 Sep.csv',size:blob.size,type:'text/csv'});save();render()}}catch(e){}
}
let S;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);return false}}catch(e){}S=seed();return true}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save in this browser')}}

// ---------- View state ----------
const UI={view:store.get(KEY+':view','client'),emp:null,client:null,type:'',q:'',form:false,empForm:false};
const emp=id=>S.employees.find(e=>e.id===id);
const clients=()=>[...new Set(S.employees.map(e=>e.client))].sort((a,b)=>a.localeCompare(b));
function scope(){if(UI.view==='team')return S.employees;const cs=clients();if(!cs.includes(UI.client))UI.client=(emp(UI.emp)||{}).client||cs[0];return S.employees.filter(e=>e.client===UI.client)}
const entriesOf=id=>S.entries.filter(x=>x.emp===id);
function lastUpdate(id){const t=isoToday();const ds=entriesOf(id).map(x=>x.date).filter(d=>d<=t).sort();return ds.length?ds[ds.length-1]:null}
function staleDays(id){const l=lastUpdate(id);return l?diffDays(isoToday(),l):null}
const isStale=id=>{const d=staleDays(id);return d===null||d>STALE_DAYS};
const lastBy=()=>store.get(KEY+':by','Loopin team');

function setView(v){UI.view=v;UI.form=false;UI.empForm=false;if(v==='client'&&emp(UI.emp))UI.client=emp(UI.emp).client;store.set(KEY+':view',v);render()}
function pick(id){UI.emp=id;UI.form=false;render()}
function setClient(c){UI.client=c;UI.emp=null;render()}
function setType(t){UI.type=t;render()}
function setQ(v){UI.q=v;const e=emp(UI.emp);if(e)$('#tl').innerHTML=timelineHTML(e)}
function toggleForm(v){UI.form=v===undefined?!UI.form:v;UI.empForm=false;render();if(UI.form){const t=$('#entryForm [name=title]');t&&t.focus()}}
function toggleEmpForm(v){UI.empForm=v===undefined?!UI.empForm:v;UI.form=false;render();if(UI.empForm){const t=$('#empForm [name=name]');t&&t.focus()}}

// ---------- Actions ----------
async function addEntry(ev){
  ev.preventDefault();const f=ev.target;const fd=new FormData(f);
  const title=String(fd.get('title')||'').trim();if(!title){toast('Give the update a title');return}
  const by=String(fd.get('by')||'').trim()||'Loopin team';store.set(KEY+':by',by);
  const btn=f.querySelector('[type=submit]');btn.disabled=true;
  const files=[];
  for(const file of f.querySelector('[name=files]').files){
    if(file.size>50*1048576){toast(`${file.name} is larger than 50 MB and was not attached`);continue}
    const id='f-'+uid();
    try{await putFile(id,file);files.push({id,name:file.name,size:file.size,type:file.type})}catch(e){toast(`Could not store ${file.name} in this browser`)}
  }
  S.entries.push({id:uid(),emp:UI.emp,type:fd.get('type'),date:fd.get('date')||isoToday(),title,text:String(fd.get('text')||'').trim(),by,files,created:Date.now()});
  save();UI.form=false;UI.type='';UI.q='';render();toast('Update added. The client can see it now.');
}
function addEmployee(ev){
  ev.preventDefault();const fd=new FormData(ev.target);
  const name=String(fd.get('name')||'').trim(),client=String(fd.get('client')||'').trim(),start=fd.get('start');
  if(!name||!client||!start){toast('Fill in name, client and start date');return}
  const id='e'+uid();
  S.employees.push({id,name,role:String(fd.get('role')||'').trim(),client,start});
  // The start date is day zero on the timeline
  S.entries.push({id:uid(),emp:id,type:'started',date:start,title:`${name} started · day zero`,text:'',by:lastBy(),files:[],created:Date.now()});
  save();UI.emp=id;UI.empForm=false;render();toast(`${name} added`);
}
function delEntry(id){
  const x=S.entries.find(e=>e.id===id);if(!x)return;
  if(!confirm(`Delete "${x.title}"? The client will no longer see it.`))return;
  S.entries=S.entries.filter(e=>e.id!==id);dropFiles((x.files||[]).map(f=>f.id));save();render();toast('Update deleted');
}
function delEmployee(id){
  const e=emp(id);if(!e)return;
  if(!confirm(`Remove ${e.name} and all of their updates?`))return;
  const gone=entriesOf(id);dropFiles(gone.flatMap(x=>(x.files||[]).map(f=>f.id)));
  S.entries=S.entries.filter(x=>x.emp!==id);S.employees=S.employees.filter(x=>x.id!==id);UI.emp=null;save();render();toast(`${e.name} removed`);
}
async function openFile(id){
  let meta=null;S.entries.some(x=>(x.files||[]).some(f=>f.id===id&&(meta=f)));
  try{
    const blob=await getFile(id);if(!blob){toast('This file is not stored in this browser');return}
    const url=URL.createObjectURL(blob);
    if(/^(application\/pdf|image\/|text\/plain)/.test(blob.type)){window.open(url,'_blank','noopener')}
    else{const a=document.createElement('a');a.href=url;a.download=meta?meta.name:'attachment';document.body.appendChild(a);a.click();a.remove()}
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){toast('Could not open the file in this browser')}
}
async function resetDemo(){if(!confirm('Replace everything with the example data?'))return;await clearFiles();S=seed();save();Object.assign(UI,{emp:null,client:null,type:'',q:'',form:false,empForm:false});render();seedFiles()}
async function startEmpty(){if(!confirm('Delete all employees and updates and start empty?'))return;await clearFiles();S={employees:[],entries:[]};save();Object.assign(UI,{emp:null,client:null,type:'',q:'',form:false,empForm:true});render()}

// ---------- Rendering ----------
function entryHTML(x,team){
  const T=TYPES[x.type]||TYPES.update;const planned=x.date>isoToday();
  const files=(x.files||[]).length?`<div class="files">${x.files.map(f=>`<button type="button" class="file" onclick="openFile('${f.id}')" title="Open ${esc(f.name)}">${CLIP}<span>${hl(f.name)}</span><small>${fmtSize(f.size)}</small></button>`).join('')}</div>`:'';
  return `<article class="entry${planned?' planned':''}"><div class="labels"><span class="label ${T.cls}">${T.label}</span>${planned?'<span class="label plain">Planned</span>':''}</div><h3>${hl(x.title)}</h3>${x.text?`<p>${hl(x.text)}</p>`:''}${files}<div class="meta"><span>by ${hl(x.by||'Loopin team')}</span>${team?`<button type="button" class="link" onclick="delEntry('${x.id}')">Delete</button>`:''}</div></article>`;
}
function timelineHTML(e){
  const team=UI.view==='team';
  let list=entriesOf(e.id);
  if(UI.type)list=list.filter(x=>x.type===UI.type);
  if(UI.q){const q=UI.q.toLowerCase();list=list.filter(x=>[x.title,x.text,x.by,(TYPES[x.type]||{}).label,...(x.files||[]).map(f=>f.name)].join(' ').toLowerCase().includes(q))}
  if(!list.length)return `<div class="card empty">${UI.q||UI.type?'Nothing matches. Try another word, or choose All.':team?'No updates yet. Use “+ Add update” to write the first one.':'No updates yet.'}</div>`;
  list.sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  // Newest first: a month heading, then one row per date holding that day's updates
  const months=[];list.forEach(x=>{const m=x.date.slice(0,7);let M=months[months.length-1];if(!M||M.m!==m){M={m,days:[]};months.push(M)}let D=M.days[M.days.length-1];if(!D||D.d!==x.date){D={d:x.date,items:[]};M.days.push(D)}D.items.push(x)});
  const today=isoToday();
  const dayLabel=d=>{const n=diffDays(d,e.start);return n<0?'':n===0?'Day 0 · started':`Day ${n}${d>today?' · planned':''}`};
  return months.map(M=>`<section aria-label="${fmt(M.m+'-01',{month:'long',year:'numeric'})}"><div class="month">${fmt(M.m+'-01',{month:'long',year:'numeric'})}</div>${M.days.map((D,i)=>`<div class="day${i===0?' first':''}${i===M.days.length-1?' last':''}"><div class="day-date"><b>${fmt(D.d,{day:'numeric',month:'long'})}</b><span>${dayLabel(D.d)}</span></div><div class="rail"><i></i></div><div class="cards">${D.items.map(x=>entryHTML(x,team)).join('')}</div></div>`).join('')}</section>`).join('');
}
function empFormHTML(){
  const today=isoToday();const cur=emp(UI.emp);
  return `<form class="card form" id="empForm" onsubmit="addEmployee(event)"><h3>Add employee</h3><div class="row"><label>Name<input name="name" required autocomplete="off"></label><label>Role<input name="role" placeholder="e.g. Virtual Assistant" autocomplete="off"></label><label>Client<input name="client" required list="clientList" autocomplete="off" value="${esc(cur?cur.client:'')}"><datalist id="clientList">${clients().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label><label>Start date<input type="date" name="start" required value="${today}"></label></div><p class="hint">The start date becomes Day 0 on the timeline.</p><div class="btns"><button class="btn primary" type="submit">Add employee</button>${S.employees.length?'<button class="btn" type="button" onclick="toggleEmpForm(false)">Cancel</button>':''}</div></form>`;
}
function entryFormHTML(e){
  return `<form class="card form" id="entryForm" onsubmit="addEntry(event)"><h3>New update for ${esc(e.name)}</h3>
  <div class="row"><label>Type<select name="type">${['update','warning','great','probation','started'].map(k=>`<option value="${k}">${TYPES[k].label}</option>`).join('')}</select></label><label>Date<input type="date" name="date" value="${isoToday()}" required></label><label>Written by<input name="by" value="${esc(lastBy())}" required autocomplete="off"></label></div>
  <label>Title<input name="title" required maxlength="140" placeholder="e.g. Watching YouTube during work hours" autocomplete="off"></label>
  <label>What happened<textarea name="text" rows="4" placeholder="What happened, what we said, what we agreed."></textarea></label>
  <label>Attach files (PDF, Excel, Word, images)<input type="file" name="files" multiple></label>
  <div class="btns"><button class="btn primary" type="submit">Add update</button><button class="btn" type="button" onclick="toggleForm(false)">Cancel</button></div></form>`;
}
function render(){
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===UI.view)));
  const team=UI.view==='team';const list=scope();
  const cs=clients();
  const head=`<div class="head"><div><h1>${team?'Employee updates':'Your Loopin team'}</h1><p>${team?'Write what happened with each employee: warnings, great work, conversations and probation reviews. The client reads this same history.':'What happened with each person since their first day. Use the search to find anything.'}</p></div><div class="head-actions">${!team&&cs.length>1?`<label>Company<select onchange="setClient(this.value)">${cs.map(c=>`<option ${c===UI.client?'selected':''}>${esc(c)}</option>`).join('')}</select></label>`:''}${team&&list.length?`<button class="btn" type="button" onclick="toggleEmpForm()">+ Add employee</button><button class="btn primary" type="button" onclick="toggleForm()">${UI.form?'Close':'+ Add update'}</button>`:''}</div></div>`;
  const foot=`<footer class="foot"><span>Saved in this browser only. Someone else opening this file starts with their own copy.</span>${team?'<button type="button" class="link" onclick="resetDemo()">Reset example data</button><button type="button" class="link" onclick="startEmpty()">Start empty</button>':''}</footer>`;
  if(!list.length){$('#app').innerHTML=head+(team?empFormHTML():'<div class="card empty">No employees yet. The Loopin team adds them under “Loopin team”.</div>')+foot;return}
  if(!UI.emp||!list.some(e=>e.id===UI.emp))UI.emp=list[0].id;
  const e=emp(UI.emp);const all=entriesOf(e.id);const cnt=t=>all.filter(x=>x.type===t).length;
  const today=isoToday();const dn=diffDays(today,e.start);const sd=staleDays(e.id);
  const people=`<div class="people" aria-label="Employees">${list.map(p=>{const d=staleDays(p.id);const note=team&&isStale(p.id)?`<span class="stale">${d===null?'No updates yet':`No update for ${d} days`}</span>`:`<span>${d===null?'No updates yet':'Last update '+ago(d)}</span>`;return `<button type="button" class="person${p.id===UI.emp?' on':''}" aria-pressed="${p.id===UI.emp}" onclick="pick('${p.id}')"><span class="av">${esc(ini(p.name))}</span><span><b>${esc(p.name)}</b>${note}</span></button>`}).join('')}</div>`;
  const hero=`<section class="hero"><div class="hero-main"><div class="eyebrow">${CAL}${dn>=0?`Started ${fmt(e.start,{day:'numeric',month:'long',year:'numeric'})} · Day ${dn}`:`Starts ${fmt(e.start,{day:'numeric',month:'long',year:'numeric'})}`}</div><h2>${esc(e.name)}</h2><p>${esc([e.role,e.client].filter(Boolean).join(' at '))}${team?` · <button type="button" class="link" onclick="delEmployee('${e.id}')">Remove employee</button>`:''}</p></div><div class="stats"><div><b>${Math.max(0,dn)}</b><span>Days with us</span></div><div><b>${cnt('great')}</b><span>Great work</span></div><div><b>${cnt('warning')}</b><span>Warnings</span></div><div><b>${all.length}</b><span>Updates</span></div><div><b class="${team&&isStale(e.id)?'red-txt':''}">${sd===null?'–':sd===0?'Today':sd+'d'}</b><span>${sd===null||sd===0?'Last update':'Since last update'}</span></div></div></section>`;
  const nudge=team&&isStale(e.id)&&!UI.form?`<div class="nudge"><span><b>${sd===null?'No updates yet.':`No update for ${sd} days.`}</b> Add this week's update for ${esc(e.name)} so the client's history stays complete.</span><button class="btn sm primary" type="button" onclick="toggleForm(true)">Add update</button></div>`:'';
  const counts={};all.forEach(x=>counts[x.type]=(counts[x.type]||0)+1);
  const menu=['warning','great','update','probation','started'].map(k=>`<button type="button" role="menuitemradio" aria-checked="${UI.type===k}" onclick="setType('${k}')"><span class="tick">${UI.type===k?'✓':''}</span><span class="dot ${TYPES[k].cls}"></span>${TYPES[k].label}<span class="n">${counts[k]||0}</span></button>`).join('');
  const bar=`<div class="bar"><div class="chips" role="group" aria-label="Filter by type"><button type="button" class="chip" aria-pressed="${!UI.type}" onclick="setType('')">All<span>${all.length}</span></button><div class="fwrap"><button type="button" class="chip fbtn" id="fbtn" aria-pressed="${!!UI.type}" aria-haspopup="menu" aria-expanded="false" aria-controls="fmenu" onclick="toggleMenu()">${FUNNEL}${UI.type?`${TYPES[UI.type].label}<span>${counts[UI.type]||0}</span>`:'Filter'}${CHEV}</button><div class="fmenu" id="fmenu" role="menu" aria-label="Filter by type" hidden>${menu}</div></div></div><div class="search">${SEARCH}<input id="q" type="search" placeholder="Search what happened…" value="${esc(UI.q)}" oninput="setQ(this.value)" aria-label="Search what happened"></div></div>`;
  $('#app').innerHTML=head+(team&&UI.empForm?empFormHTML():'')+people+hero+nudge+(team&&UI.form?entryFormHTML(e):'')+bar+`<div class="tl" id="tl">${timelineHTML(e)}</div>`+foot;
}

// Filter menu: opens under the "Filter" button, closes on a choice, an outside click or Escape
function toggleMenu(open){const m=$('#fmenu'),b=$('#fbtn');if(!m)return;open=open===undefined?m.hidden:open;m.hidden=!open;b.setAttribute('aria-expanded',String(open));if(open){const first=m.querySelector('[aria-checked="true"]')||m.querySelector('button');first&&first.focus()}}
document.addEventListener('click',ev=>{if(!ev.target.closest('.fwrap'))toggleMenu(false)});
document.addEventListener('keydown',ev=>{const m=$('#fmenu');if(!m||m.hidden)return;
  if(ev.key==='Escape'){toggleMenu(false);$('#fbtn').focus()}
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();const items=[...m.querySelectorAll('button')];const i=items.indexOf(document.activeElement);items[(i+(ev.key==='ArrowDown'?1:-1)+items.length)%items.length].focus()}});

const fresh=load();render();if(fresh){save();seedFiles()}
</script>
</body>
</html>
